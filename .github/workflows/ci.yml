name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run --frozen black --check .
      - run: uv run --frozen ruff check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra aws
      - run: uv run --frozen pytest

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra aws
      - name: Start Dex, Vault and the SSM emulator
        run: docker compose -f docker/tests/docker-compose.yaml up -d --wait dex vault ssm
      - run: uv run --frozen pytest tests/integration -v
        env:
          DEXUS_INTEGRATION: "1"
      - name: Service logs
        if: failure()
        run: docker compose -f docker/tests/docker-compose.yaml logs

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/image/Dockerfile
          load: true
          push: false
          tags: dexus-vault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for fixable HIGH/CRITICAL vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          dexus-vault:ci

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies for known vulnerabilities
        run: uv audit --preview-features audit-command --frozen
      - name: Audit GitHub workflows (zizmor)
        run: uvx zizmor@1.31.1 --format github .github
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Static analysis (bandit)
        run: uvx bandit@1.9.2 -q -r dexus_vault scripts -x dexus_vault/grpc_dexidp
