# Called by the release workflow (publish-to-pypi.yml) for every new release.
# Run it by hand to publish the image of an existing release tag again.
name: Publish Docker 🐳 image 📦 to DockerHub
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      latest:
        description: Also move the latest tag
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. 0.4.0
        required: true
        type: string
      latest:
        description: Also move the latest tag (only for the newest release)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read # checkout only
      id-token: write # keyless cosign signing

    steps:
      - name: Validate the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          # "latest" only when asked for: republishing an older tag must not move it
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no build cache in releases; attach SBOM and provenance attestations
          no-cache: true
          sbom: true
          provenance: mode=max

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # keyless signature with the workflow identity, recorded in Rekor
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
