# Called by the release workflow (publish-to-pypi.yml) for every new release.
# Run it by hand, from main, to publish the image of an existing release again;
# the tag must point to a commit on main whose __version__ matches it.
name: Publish Docker 🐳 image 📦 to DockerHub
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      sha:
        description: Commit the tag must point to
        required: true
        type: string
      latest:
        description: Also move the latest tag
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. 0.4.0
        required: true
        type: string
      latest:
        description: Also move the latest tag (only for the newest release)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, push and sign the image
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read # checkout only
      id-token: write # keyless cosign signing

    steps:
      - name: Checkout with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the release and check out its commit
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'$TAG' is not a release tag"
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            fail "run this workflow from main"
          fi
          commit=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}") || fail "tag $TAG does not exist"
          if [ -n "$EXPECTED_SHA" ] && [ "$commit" != "$EXPECTED_SHA" ]; then
            fail "tag $TAG points to $commit, expected $EXPECTED_SHA"
          fi
          git merge-base --is-ancestor "$commit" origin/main || fail "tag $TAG is not on main"
          git checkout -q --detach "$commit"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' dexus_vault/__version__.py)
          [ "$version" = "$TAG" ] || fail "commit $commit has __version__ $version, not $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$commit" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          # "latest" only when asked for: republishing an older tag must not move it
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no build cache in releases; attach SBOM and provenance attestations
          no-cache: true
          sbom: true
          provenance: mode=max

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # keyless signature with the workflow identity, recorded in Rekor
        run: cosign sign --yes -a "commit=${RELEASE_SHA}" -a "tag=${RELEASE_TAG}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
