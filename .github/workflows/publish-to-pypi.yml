# Release workflow. A release happens when a reviewed pull request that bumps
# dexus_vault/__version__.py is merged into main: the version has no tag yet, so
# this workflow builds, publishes to PyPI, creates the tag and the signed GitHub
# release, then publishes the Docker image. Nobody pushes tags by hand.
#
# The file name must stay publish-to-pypi.yml: PyPI trusted publishing is bound
# to it, and the PyPI upload cannot move into a reusable workflow.
name: Release
on:
  push:
    branches: [main]
    paths: [dexus_vault/__version__.py]
  # retry a release whose tag does not exist yet
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout and read tags
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: version
        name: Compare the package version with existing tags
        run: scripts/release-plan.sh

  build:
    name: Build distributions
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache in release builds, so nothing written by other runs ends up in them
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dexus-vault
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # a retried release must not fail on files PyPI already has
          skip-existing: true

  github-release:
    name: Tag, sign and create the GitHub release
    needs: [plan, publish-to-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release
      id-token: write # keyless Sigstore signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create the tag and release on the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes
          fi

  docker:
    name: Publish the Docker image
    needs: [plan, github-release]
    permissions:
      contents: read # checkout of the new tag
      id-token: write # keyless cosign signing
    uses: $/.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.plan.outputs.version }}
      latest: true
