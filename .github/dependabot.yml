version: 2
# a cooldown gives the ecosystem time to spot a compromised release before we pick it up
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /docker/image
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directories:
      - /docker/tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
